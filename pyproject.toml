[project]
name = "plamo3-openvino-cli"
version = "0.1.0"
description = "PLaMo 3 Translate 8B OpenVINO CUI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openvino==2026.4.1",
  "transformers==4.57.1",
  "torch>=2.6,<3",
  "accelerate>=1,<2",
  "numba>=0.61,<1",
  "numpy>=2,<3",
  "nncf>=2.19,<3",
  "huggingface-hub[hf-xet]>=0.36,<1",
  "openvino-genai==2026.4.1",
]

[project.scripts]
plamo-translate = "plamo3.plamo_translate:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["plamo3", "gemma"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
